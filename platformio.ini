; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = heltec_wifi_lora_32_V3   ; pio run builds only this one, the test variant with -e heltec_wifi_lora_32_V3_test

[env:heltec_wifi_lora_32_V3]
;platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
board = heltec_wifi_lora_32_V3
framework = arduino
board_build.partitions = partitions.csv
build_flags =
    ; URL of the update server Souper, without trailing /. Fixed at build time, not changeable on the device
    '-D SOUPER_URL="http://minlux.de/souper"'
extra_scripts =
    pre:git_version.py
    post:sign_firmware.py

lib_deps =
    https://github.com/libdriver/sx1262#20beaef3ae258e96c7e028c2c677ba460d334ef3
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

; These build flags are already defined in "boards/dongles3.json"
; build_flags = 
;     -DARDUINO_USB_MODE=1
;     -DARDUINO_USB_CDC_ON_BOOT=1

; monitor_speed = 115200
; upload_port = /dev/ttyACM0
; upload_speed = 230400


; Like heltec_wifi_lora_32_V3, but with an update server in the LAN, to test the update via the update server:
;    pio run -e heltec_wifi_lora_32_V3_test
; Image: .pio/build/heltec_wifi_lora_32_V3_test/firmware.signed.bin. For test/souper_mock.py change the URL to
; http://<ip-of-the-pc>:8090/souper
[env:heltec_wifi_lora_32_V3_test]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    '-D SOUPER_URL="http://192.168.178.33/souper"'
